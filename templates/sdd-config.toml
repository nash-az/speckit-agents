# speckit-agents run config. Read by /sdd-run and bin/sdd-tasks.py.

[run]
# Feature folder, e.g. "specs/001-my-feature". Empty: follow .specify/feature.json.
feature = ""
# Implementer attempts after the first rejection by the verifier.
max_retries = 2
# Runs commit on a new branch named <branch_prefix><run id>; protected branches are never committed to.
branch_prefix = "auto/"
protected_branches = ["main", "master"]
# Subagents may not edit these during a run (globs: * within a segment, ** across).
protected_paths = [
  ".specify/memory/constitution.md",
  "specs/*/spec.md",
  ".claude/settings.json",
  ".claude/settings.local.json",
  ".sdd/**",
]

[checks]
# Every command must pass before a task is committed. Run from the project root.
commands = []

[allow]
# Tasks tagged [dep] / [download] run only when these are true.
dependencies = false
downloads = false

# [agents]
# Optional model per role; a missing role uses the run's model (the session's, or the profile's).
# Keys: implementer, verifier, evaluator, bookkeeper. Values: an alias (haiku, sonnet, opus), "inherit" or a model id.
# implementer = "haiku"
# verifier = "opus"

# [profiles.<name>]
# Run profiles, used only by headless runs: bin/sdd-supervise.py --profile <name>. `model` is required, `env` optional.
# A gateway to a non-Claude or local model is best-effort and unsupported by Anthropic.
# Secrets never go in this file: env names with KEY, TOKEN, SECRET or PASSWORD are refused; set them in your environment.
# [profiles.cheap]
# model = "haiku"
#
# [profiles.local]
# model = "claude-sonnet-5-5"
# env = { ANTHROPIC_BASE_URL = "http://localhost:4000" }
